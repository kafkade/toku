name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Change detection ──────────────────────────────────────────────────────────
  # Determines which areas were modified so downstream jobs can skip irrelevant
  # work on PRs. Push-to-main always runs everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.*'
            docs:
              - '**/*.md'
              - '.markdownlint*'
            apple:
              - 'toku-apple/**'
              - 'crates/toku-ffi/**'

  # ── Rust checks ───────────────────────────────────────────────────────────────

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Formatting
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: MSRV (1.88)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace

  audit:
    name: Security audit
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Transitive DoS advisories in `quick-xml`, reachable only through
          # toku-desktop's Tauri stack (plist / tauri-winrt-notification). No
          # in-range upgrade exists yet (fixed in quick-xml >= 0.41.0, but the
          # intermediate crates pin ^0.37 / ^0.39). Mirrors .cargo/audit.toml;
          # remove both once the Tauri chain adopts quick-xml 0.41. See #160.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

  # ── Documentation ─────────────────────────────────────────────────────────────

  markdownlint:
    name: Markdown lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: "**/*.md"

  # ── Apple apps (iOS + macOS + watchOS) ────────────────────────────────────────
  # Compile-check the SwiftUI apps against the toku-ffi static libs so they don't
  # silently break. Builds the simulator slices (iOS + watchOS) and the macOS host
  # app (device builds add signing + time without catching more source breakage).
  # No code signing.
  apple:
    name: Apple build (iOS + macOS + watchOS)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-watchos-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build toku-ffi (iOS + watchOS simulators + macOS host)
        run: |
          cargo build --release -p toku-ffi --target aarch64-apple-ios-sim
          cargo build --release -p toku-ffi --target aarch64-apple-watchos-sim
          cargo build --release -p toku-ffi
          cp crates/toku-ffi/toku.h toku-apple/TokuKit/Sources/CTokuFFI/toku.h
      - name: Generate Xcode project
        working-directory: toku-apple
        run: xcodegen generate
      - name: Build iOS app
        working-directory: toku-apple
        run: |
          xcodebuild -project Toku.xcodeproj -scheme TokuiOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64
      - name: Build macOS app
        working-directory: toku-apple
        run: |
          xcodebuild -project Toku.xcodeproj -scheme TokuMac \
            -destination 'platform=macOS' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Build watchOS app
        working-directory: toku-apple
        run: |
          xcodebuild -project Toku.xcodeproj -scheme TokuWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64

  # ── At-rest encryption (SQLCipher) ────────────────────────────────────────────
  # Proves the off-by-default `sqlcipher` feature (ADR-016) still compiles and its
  # keyed-open / migration tests pass. Deliberately NON-gating: it is intentionally
  # omitted from the `validate` job's `needs` list so the "Validate" required status
  # check — and therefore kafkade/github-infra → repo_toku.tf — is unchanged. The
  # feature bundles SQLCipher + vendored OpenSSL, which is the biggest cross-compile
  # hazard in the tree; keeping this leg off the gate avoids blocking PRs on it.
  sqlcipher:
    name: SQLCipher feature (toku-db)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: sqlcipher
      - run: cargo clippy -p toku-db --features sqlcipher --all-targets -- -D warnings
      - run: cargo test -p toku-db --features sqlcipher

  # ── Summary gate ──────────────────────────────────────────────────────────────
  # Single required status check for branch protection. Downstream jobs may be
  # skipped (path filters) — that is OK; only failures or cancellations block.
  #
  # NOTE: This job is named "Validate" to match the required_status_checks in
  # kafkade/github-infra → repo_toku.tf. If you rename it, update the IaC first.
  validate:
    name: Validate
    if: always()
    needs: [test, clippy, fmt, msrv, audit, markdownlint, apple]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All checks passed
        run: echo "All CI checks passed"
