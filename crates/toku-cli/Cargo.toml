[package]
name = "toku-cli"
description = "CLI interface for Toku personal book manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "toku"
path = "src/main.rs"

[dependencies]
toku-core.workspace = true
toku-db.workspace = true
toku-meta.workspace = true
toku-import.workspace = true
toku-export.workspace = true
toku-web.workspace = true
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
anyhow = "1"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tabled = "0.20"
ratatui = "0.29"
crossterm = "0.28"
csv = "1"
