[package]
name = "toku-cli"
description = "CLI interface for Toku personal book manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "toku"
path = "src/main.rs"

[features]
# Opt-in at-rest DB encryption via SQLCipher (ADR-016). OFF by default; enables
# the `toku db encrypt/decrypt/status` commands and keyed opens across the CLI,
# the embedded web server, and the sync client.
sqlcipher = ["toku-db/sqlcipher", "toku-web/sqlcipher", "toku-sync-client/sqlcipher"]

[dependencies]
toku-core.workspace = true
toku-db.workspace = true
toku-meta.workspace = true
toku-import.workspace = true
toku-export.workspace = true
toku-files.workspace = true
toku-web.workspace = true
toku-sync-client.workspace = true
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
anyhow = "1"
chrono.workspace = true
keyring-core = "1"
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tabled = "0.21"
ratatui = "0.30"
crossterm = "0.29"
csv = "1"
uuid.workspace = true
rpassword = "7"
base64 = "0.23"
hostname = "0.4"
pdf-writer = "0.15"

# Platform-native credential stores for the keyring-core ecosystem (keyring 4.x).
# The umbrella `keyring` crate is intentionally not used: on desktop it pulls in
# the SQLite (Turso) fallback store and its heavy transitive deps, some of which
# require a newer rustc than our MSRV. Depending on the specific native stores
# keeps the dependency tree small and MSRV-compatible.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
