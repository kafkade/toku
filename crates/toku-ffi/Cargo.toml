[package]
name = "toku-ffi"
description = "C FFI bindings for Toku — enables Swift/iOS and other native frontends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# Passthrough: enable at-rest DB encryption support (ADR-016). OFF by default.
# Kept OFF in the CI `apple` cross-compile to avoid the OpenSSL build hazard.
sqlcipher = ["toku-db/sqlcipher"]

[dependencies]
toku-core.workspace = true
toku-db.workspace = true
toku-import.workspace = true
toku-sync-client.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

[build-dependencies]
cbindgen = "0.29"
