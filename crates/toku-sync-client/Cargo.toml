[package]
name = "toku-sync-client"
description = "Reusable sync client for Toku — HTTP client, credential storage, wire format, and push/pull orchestration shared by the CLI and FFI frontends"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
toku-core.workspace = true
toku-db.workspace = true
anyhow = "1"
chrono.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
keyring-core = "1"
base64 = "0.22"
hostname = "0.4"

# Platform-native credential stores for the keyring-core ecosystem (keyring 4.x).
# Mirrors toku-cli: depend on the specific native stores rather than the umbrella
# `keyring` crate to keep the dependency tree small and MSRV-compatible.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
