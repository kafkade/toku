[package]
name = "toku-sync"
description = "Sync relay server for Toku personal book manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "toku-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
chrono.workspace = true
hex = "0.4"
rand = "0.10"
rusqlite.workspace = true
refinery = { version = "0.9", features = ["rusqlite"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# SRP-6a (RFC 5054) authentication — flagged for dependency review (RC)
srp = { version = "0.7.0-rc.3", features = ["getrandom"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
rand = "0.10"
reqwest = { workspace = true, features = ["json", "blocking"] }
sha2.workspace = true
srp = { version = "0.7.0-rc.3", features = ["getrandom"] }
tower = "0.5"
toku-core.workspace = true
toku-db.workspace = true
toku-sync-client.workspace = true
tempfile = "3"
