[package]
name = "toku-web"
description = "Web dashboard for Toku personal book manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
toku-core.workspace = true
toku-db.workspace = true
toku-import.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite.workspace = true
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
maud = "0.27"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
urlencoding = "2"
sha2.workspace = true
hex = "0.4"
base64 = "0.22"
rand = "0.10"
form_urlencoded = "1"
# SRP-6a (RFC 5054) verifier check for hosted-mode login — flagged for
# dependency review (RC). Same crate/version as toku-sync.
srp = { version = "0.7.0-rc.3", features = ["getrandom"] }
subtle = "2"
time = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
