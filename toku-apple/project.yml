name: Toku
options:
  bundleIdPrefix: dev.toku
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

packages:
  TokuKit:
    path: TokuKit

targets:
  TokuiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TokuiOS
        excludes:
          - "Info.plist"
          - "TokuiOS.entitlements"
    dependencies:
      - package: TokuKit
        product: TokuKit
      - package: TokuKit
        product: TokuKitUI
    settings:
      base:
        # Use the hand-authored Info.plist (camera usage string, orientations,
        # etc.) rather than letting Xcode generate one.
        INFOPLIST_FILE: TokuiOS/Info.plist
        # App Group entitlement so the app and the watch complication can share a
        # snapshot via group.com.kafkade.toku. Only enforced for signed device
        # builds; unsigned simulator/CI builds (CODE_SIGNING_ALLOWED=NO) ignore it.
        CODE_SIGN_ENTITLEMENTS: TokuiOS/TokuiOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.kafkade.toku.ios
        PRODUCT_NAME: Toku
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # Set your free Apple ID team here, or pick it in Xcode's
        # Signing & Capabilities tab. Leaving it blank is fine for the first open.
        DEVELOPMENT_TEAM: ""
        # toku-ffi is linked via the CTokuFFI module map (link "toku_ffi").
        # rusqlite needs system libsqlite3; getrandom/keychain need Security.
        OTHER_LDFLAGS:
          - "-lsqlite3"
          - "-framework"
          - "Security"
        # Per-SDK search paths for the prebuilt release static libraries.
        # Build them first with: ./build-ffi.sh
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release"

  # ---------------------------------------------------------------------------
  # macOS desktop app. Full-featured library / stats UI reusing the shared TokuKit
  # layer over toku-ffi. Wired into project.yml (and CI) so it is generated by
  # XcodeGen and never silently breaks — closing the iOS/macOS/watchOS CI gap
  # called out in issue #178.
  # ---------------------------------------------------------------------------
  TokuMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Toku
    dependencies:
      - package: TokuKit
        product: TokuKit
      - package: TokuKit
        product: TokuKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafkade.toku.mac
        PRODUCT_NAME: Toku
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        # No hand-authored Info.plist for macOS — let Xcode synthesize one.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # toku-ffi is linked via the CTokuFFI module map (link "toku_ffi").
        # rusqlite needs system libsqlite3; keychain/getrandom need Security.
        OTHER_LDFLAGS:
          - "-lsqlite3"
          - "-framework"
          - "Security"
        # The host (arm64) release static lib lives in target/release. Build it
        # first with: ./build-ffi.sh (or cargo build --release -p toku-ffi).
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(PROJECT_DIR)/../target/release"

  # ---------------------------------------------------------------------------
  # watchOS companion app (issue #178). A wrist-first companion that reuses the
  # shared TokuKit layer over toku-ffi. It keeps its own local FFI database and
  # syncs through the existing op-log (same model as the iOS app), so it builds
  # and runs on a watch simulator without a paired phone.
  # ---------------------------------------------------------------------------
  TokuWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: TokuWatch
        excludes:
          - "Info.plist"
          - "TokuWatch.entitlements"
      - path: TokuWatchShared
    dependencies:
      - package: TokuKit
        product: TokuKit
      - target: TokuWatchComplication
        embed: true
    settings:
      base:
        INFOPLIST_FILE: TokuWatch/Info.plist
        # Shares the group.com.kafkade.toku App Group with the iOS app and the
        # complication so live reading data reaches the watch face.
        CODE_SIGN_ENTITLEMENTS: TokuWatch/TokuWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.kafkade.toku.ios.watchkitapp
        PRODUCT_NAME: Toku
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # toku-ffi is linked via the CTokuFFI module map (link "toku_ffi").
        # rusqlite needs system libsqlite3; getrandom/keychain need Security.
        OTHER_LDFLAGS:
          - "-lsqlite3"
          - "-framework"
          - "Security"
        # Per-SDK search paths for the prebuilt release static libraries.
        # Build them first with: ./build-ffi.sh
        "LIBRARY_SEARCH_PATHS[sdk=watchos*]": "$(PROJECT_DIR)/../target/aarch64-apple-watchos/release"
        "LIBRARY_SEARCH_PATHS[sdk=watchsimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-watchos-sim/release"
        # The prebuilt toku-ffi simulator static lib is arm64-only (Apple Silicon).
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": "x86_64"

  # WidgetKit extension providing watch-face complications (current book + streak).
  # Deliberately does NOT link toku-ffi: it reads a small shared snapshot written
  # by the watch app, keeping the extension lightweight.
  TokuWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: TokuWatchComplication
        excludes:
          - "Info.plist"
          - "TokuWatchComplication.entitlements"
      - path: TokuWatchShared
    settings:
      base:
        INFOPLIST_FILE: TokuWatchComplication/Info.plist
        # Same App Group as the watch app so the extension can read the shared
        # WatchSnapshot instead of rendering a placeholder.
        CODE_SIGN_ENTITLEMENTS: TokuWatchComplication/TokuWatchComplication.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.kafkade.toku.ios.watchkitapp.complication
        PRODUCT_NAME: TokuWatchComplication
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": "x86_64"
